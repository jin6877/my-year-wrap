<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      }
      .poster {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0613;
        display: flex;
        align-items: center;
      }
      /* ambient glows */
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.55;
      }
      .g1 {
        width: 620px;
        height: 620px;
        left: -160px;
        top: -220px;
        background: radial-gradient(closest-side, #ff2e8e, transparent);
      }
      .g2 {
        width: 720px;
        height: 720px;
        right: -220px;
        bottom: -260px;
        background: radial-gradient(closest-side, #6a2cff, transparent);
      }
      .g3 {
        width: 460px;
        height: 460px;
        right: 180px;
        top: -200px;
        background: radial-gradient(closest-side, #4cc9f0, transparent);
        opacity: 0.35;
      }
      .grain {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1px 1px at 20% 30%, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(1px 1px at 70% 60%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1px 1px at 40% 80%, rgba(255, 255, 255, 0.35), transparent);
        opacity: 0.4;
      }

      .left {
        position: relative;
        z-index: 5;
        padding: 0 0 0 74px;
        width: 640px;
        color: #fff;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
      }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(140deg, #ff1e8e, #8a2be2 55%, #4361ee);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px -6px rgba(236, 72, 153, 0.7);
      }
      .logo svg {
        width: 24px;
        height: 24px;
      }
      .wordmark {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.32em;
        color: rgba(255, 255, 255, 0.82);
      }
      h1 {
        font-size: 62px;
        line-height: 1.12;
        font-weight: 700;
        letter-spacing: -0.015em;
      }
      h1 .grad {
        background: linear-gradient(100deg, #ff6ec4, #d16bff 45%, #6aa8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tagline {
        margin-top: 24px;
        font-size: 21px;
        line-height: 1.55;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.62);
        max-width: 480px;
      }
      .pills {
        margin-top: 32px;
        display: flex;
        gap: 10px;
      }
      .pill {
        font-size: 15px;
        font-weight: 600;
        padding: 9px 17px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(4px);
      }

      /* phone mockups */
      .stage {
        position: absolute;
        right: -30px;
        top: 0;
        bottom: 0;
        width: 620px;
        z-index: 4;
      }
      .phone {
        position: absolute;
        width: 268px;
        height: 476px;
        border-radius: 34px;
        overflow: hidden;
        background: #000;
        border: 7px solid #141019;
        box-shadow: 0 40px 90px -20px rgba(0, 0, 0, 0.75),
          0 0 0 1px rgba(255, 255, 255, 0.05);
      }
      .phone img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .phone.back {
        right: 300px;
        top: 112px;
        transform: rotate(-7deg);
        filter: brightness(0.92);
      }
      .phone.front {
        right: 70px;
        top: 74px;
        transform: rotate(5deg);
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="glow g1"></div>
      <div class="glow g2"></div>
      <div class="glow g3"></div>
      <div class="grain"></div>

      <div class="left">
        <div class="brand">
          <span class="logo">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 20 L32 46 L46 20" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="32" cy="13" r="3.4" fill="#fff"/>
            </svg>
          </span>
          <span class="wordmark">MY&nbsp;YEAR&nbsp;WRAP</span>
        </div>

        <h1>
          2026, 당신의 한 해를<br />
          <span class="grad">카드 한 장으로.</span>
        </h1>

        <p class="tagline">
          올해의 나를 입력하면, 감각적인 Wrapped 스타일<br />
          결산 스토리 카드가 완성돼요. 바로 저장하고 공유하세요.
        </p>

        <div class="pills">
          <span class="pill">✦ 스토리 카드</span>
          <span class="pill">📥 원탭 저장·공유</span>
          <span class="pill">🎨 5가지 테마</span>
        </div>
      </div>

      <div class="stage">
        <div class="phone back"><img src="card-moment.png" alt="" /></div>
        <div class="phone front"><img src="card-cover.png" alt="" /></div>
      </div>
    </div>
  </body>
</html>
